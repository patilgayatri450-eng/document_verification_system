{% extends "base.html" %}
{% block title %}Create Student Account{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create Student Account</h1>
  <form method="post">
    <label>Full Name</label>
    <input type="text" name="full_name" required autofocus>
    <label>Phone Number (for SMS reminders — include country code, e.g. +919876543210)</label>
    <input type="tel" name="phone_number" placeholder="+91XXXXXXXXXX">
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Password</label>
    <input type="password" name="password" required minlength="6">
    <button type="submit">Create Account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
